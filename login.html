<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ByteSpace</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=clash-display@600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <style>
    body { background: #0A0A0A; margin: 0; }
    .auth-layout { display: flex; min-height: 100vh; }
    .auth-visual { flex: 1.1; background: var(--blue-800); position: relative; overflow: hidden; padding: 60px 80px; color: white; display: flex; flex-direction: column; }
    .auth-form-container { flex: 0.9; display: flex; align-items: center; justify-content: center; background: #0A0A0A; padding: 40px; }
    .form-card { background: white; border-radius: 24px; padding: 48px; width: 100%; max-width: 440px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .auth-visual::before {
      content: ''; position: absolute; inset: 0;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(255,255,255,0.08) 79px, rgba(255,255,255,0.08) 80px),
                        repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(255,255,255,0.08) 79px, rgba(255,255,255,0.08) 80px);
      pointer-events: none; z-index: 0;
    }
    .av-content { position: relative; z-index: 2; }
    .logo-container { display: flex; align-items: center; gap: 8px; margin-bottom: 60px; text-decoration: none; }
    .logo-text { font-family: var(--font-logo); font-size: 24px; font-weight: 700; color: white; }
    
    .av-title { font-family: var(--font-heading); font-size: 32px; font-weight: 800; margin-bottom: 16px; line-height: 1.2; }
    .av-desc { font-size: 15px; color: rgba(255,255,255,0.8); line-height: 1.7; max-width: 380px; }

    .av-illustration { position: relative; margin-top: 60px; z-index: 2; max-width: 320px; }
    .av-course-card { background: white; border-radius: 20px; padding: 16px; box-shadow: 0 16px 32px rgba(0,0,0,0.15); color: var(--gray-950); position: relative; z-index: 3; }
    .av-course-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
    .av-cc-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .av-cc-author { font-size: 12px; color: var(--gray-400); margin-bottom: 12px; display: block; }
    .av-cc-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .av-cc-badge { background: var(--gray-100); color: var(--gray-700); font-size: 11px; padding: 4px 10px; border-radius: 6px; font-weight: 600; }
    .av-cc-price { font-size: 18px; font-weight: 800; color: var(--blue-800); }
    .av-cc-price span { font-size: 11px; font-weight: 400; color: var(--gray-400); }

    .av-students-card { position: absolute; bottom: -20px; right: -40px; background: var(--lime-400); border-radius: 16px; padding: 12px 16px; box-shadow: 0 12px 24px rgba(0,0,0,0.1); z-index: 4; }
    .av-students-card .st-label { font-size: 12px; font-weight: 700; color: var(--gray-950); margin-bottom: 6px; }

    .av-blob-circle { position: absolute; top: -30px; left: -20px; width: 60px; height: 60px; border: 12px solid var(--lime-400); border-radius: 50%; z-index: 4; }
    .av-blob-triangle { position: absolute; bottom: 20px; left: -30px; width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-bottom: 45px solid var(--lime-400); z-index: 4; transform: rotate(-15deg); }
    .av-blob-zigzag { position: absolute; top: 100px; right: -30px; width: 50px; height: 60px; background: white; border-radius: 40% 60% 70% 30%; z-index: 2; opacity: 0.9; }

    /* Form Styles */
    .fc-subtitle { font-size: 13px; color: var(--blue-800); font-weight: 600; margin-bottom: 4px; }
    .fc-title { font-family: var(--font-heading); font-size: 32px; font-weight: 800; color: var(--gray-950); margin-bottom: 32px; }
    .fc-label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 8px; }
    .fc-input { width: 100%; padding: 14px 16px; border: 1px solid var(--gray-200); border-radius: 12px; font-size: 14px; margin-bottom: 20px; color: var(--gray-950); transition: all 0.2s; }
    .fc-input:focus { border-color: var(--lime-400); outline: none; box-shadow: 0 0 0 3px rgba(212,251,32,0.2); }
    
    .fc-btn { background: var(--lime-400); color: var(--gray-950); font-family: var(--font-heading); font-weight: 700; font-size: 15px; border: none; padding: 14px; width: 100%; border-radius: 50px; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
    .fc-btn:hover { opacity: 0.9; }

    .fc-divider { display: flex; align-items: center; margin: 24px 0; color: var(--gray-400); font-size: 12px; }
    .fc-divider::before, .fc-divider::after { content: ''; flex: 1; height: 1px; background: var(--gray-200); }
    .fc-divider::before { margin-right: 12px; }
    .fc-divider::after { margin-left: 12px; }

    .fc-socials { display: flex; gap: 16px; justify-content: center; margin-bottom: 24px; }
    .fc-social-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: center; background: white; cursor: pointer; transition: background 0.2s; }
    .fc-social-btn:hover { background: var(--gray-50); }
    .fc-social-btn img { width: 20px; height: 20px; }

    .fc-footer { text-align: center; font-size: 13px; color: var(--gray-700); }
    .fc-footer a { color: var(--blue-800); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-layout">
    <!-- Left Visual -->
    <div class="auth-visual">
      <div class="av-content">
        <a href="index.html" class="logo-container">
          <div class="navbar__logo-icon"></div>
          <span class="logo-text">ByteSpace</span>
        </a>
        
        <h1 class="av-title">Sign in with ease</h1>
        <p class="av-desc">Experience a seamless and efficient sign-in process that grants you instant access to a world of knowledge.</p>
        
        <div class="av-illustration">
          <div class="av-blob-circle"></div>
          <div class="av-blob-triangle"></div>
          <div class="av-blob-zigzag"></div>

          <div class="av-course-card">
            <img src="assets/images/d6.jpg" alt="Course thumb">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <div class="av-cc-title">the Power of Big Data</div>
                <span class="av-cc-author">by purepearl studio</span>
              </div>
              <div style="font-size:12px; font-weight:600; color:var(--gray-700);">4.5 <span style="color:var(--lime-400);">★</span></div>
            </div>
            
            <div class="av-cc-meta">
              <span class="av-cc-badge">Beginner</span>
              <div class="fs-avatars" style="margin:0;">
                <div class="fs-avatar" style="width:24px;height:24px;"><img src="assets/images/d9.jpg" alt="s1"></div>
                <div class="fs-avatar" style="width:24px;height:24px;background:#4A90D9;display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:700;">B</div>
                <div class="fs-avatar" style="width:24px;height:24px;background:#E53E3E;display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:700;">C</div>
                <div class="fs-more" style="width:24px;height:24px;font-size:9px;">20+</div>
              </div>
            </div>
            <div class="av-cc-price">$25<span>/lifetime</span></div>
          </div>

          <div class="av-students-card">
            <div class="st-label">Happy Students</div>
            <div style="display:flex; align-items:center; gap:8px;">
              <div style="font-size:11px; font-weight:700; color:var(--gray-950);">4.5 <span style="color:var(--blue-800);">★</span></div>
              <div class="fs-avatars" style="margin:0;">
                <div class="fs-avatar" style="width:20px;height:20px;"><img src="assets/images/d9.jpg" alt="s1"></div>
                <div class="fs-avatar" style="width:20px;height:20px;background:#4A90D9;display:flex;align-items:center;justify-content:center;color:white;font-size:9px;font-weight:700;">B</div>
                <div class="fs-avatar" style="width:20px;height:20px;background:#E53E3E;display:flex;align-items:center;justify-content:center;color:white;font-size:9px;font-weight:700;">C</div>
                <div class="fs-more" style="width:20px;height:20px;font-size:8px;">2K+</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Right Form -->
    <div class="auth-form-container">
      <div class="form-card">
        <div class="fc-subtitle">Sign In</div>
        <h2 class="fc-title">Welcome Back</h2>
        
        <form action="search.html">
          <div>
            <label class="fc-label">Email</label>
            <input type="email" class="fc-input" placeholder="designer@example.com" required>
          </div>
          <div>
            <label class="fc-label">Password</label>
            <input type="password" class="fc-input" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="fc-btn">Sign In</button>
        </form>

        <div class="fc-divider">or</div>

        <div class="fc-socials">
          <button class="fc-social-btn" aria-label="Facebook">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </button>
          <button class="fc-social-btn" aria-label="Google">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          </button>
        </div>

        <div class="fc-footer">
          New user? <a href="register.html">Create an account</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
